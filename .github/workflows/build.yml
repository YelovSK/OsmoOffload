name: Build exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install -e .[dev] pyinstaller

      - name: Test
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name OsmoOffload --icon assets\icon.ico --paths src gui_entry.py

      - uses: actions/upload-artifact@v4
        with:
          name: OsmoOffload
          path: dist/OsmoOffload.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/OsmoOffload.exe --title "$env:GITHUB_REF_NAME" --generate-notes
